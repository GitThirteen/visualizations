<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Landing page for visualizations made by Michael Eickmeyer.">

  <title>Visualizations | Michael Eickmeyer</title>

  <link rel="stylesheet" href="design.css">
  <!--<link rel="icon" type="image/x-icon" href="assets/img/icons/favicon.ico">-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

</head>

<body>
  <div class="scrollbar" aria-hidden="true">
    <div class="scroll-track">
      <div class="scroll-thumb">
        <span class="scroll-percent">0%</span>
      </div>
    </div>
  </div>

  <main>
    <div class="title-area">
      <h1 class="main">Visualizations</h1>
      <h2 class="sub">This is currently Work in Progress!</h2>
      <div class="divider"></div>
    </div>

    <div class="vis-list">
      <div href="" class="vis-cell">
        <img class="vis-image">
        <div class="vis-info">
          <h2 class="vis-title">Interactive Path Tracing (WIP)</h2>
          <p class="vis-description"></p>
        </div>
      </div>
      <div href="" class="reversed vis-cell">
        <img class="vis-image">
        <div class="vis-info">
          <h2 class="vis-title">CT Volume Visualization (WIP)</h2>
          <p class="vis-description"></p>
        </div>
      </div>
      <div href="" class="vis-cell">
        <img class="vis-image">
        <div class="vis-info">
          <h2 class="vis-title">Urban Isochrone Wavefront (WIP)</h2>
          <p class="vis-description"></p>
        </div>
      </div>
      <div href="" class="reversed vis-cell">
        <img class="vis-image">
        <div class="vis-info">
          <h2 class="vis-title">Russo-Ukrainian War (WIP)</h2>
          <p class="vis-description"></p>
        </div>
      </div>
      <div href="" class="vis-cell">
        <img class="vis-image">
        <div class="vis-info">
          <h2 class="vis-title">Black Hole Simulation (WIP)</h2>
          <p class="vis-description"></p>
        </div>
      </div>
      <div href="./sfwaterquality/" class="reversed vis-cell">
        <img class="vis-image">
        <div class="vis-info">
          <h2 class="vis-title">San Francisco Water Quality (WIP)</h2>
          <p class="vis-description"></p>
        </div>
      </div>
      <div href="" class="vis-cell">
        <img class="vis-image">
        <div class="vis-info">
          <h2 class="vis-title">Dynamic Volume Illumination (WIP)</h2>
          <p class="vis-description"></p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
